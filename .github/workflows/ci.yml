# req: failed log available in detail

name: UT + valgrind

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '51-54 2 * * 4'  # 10:51-54am(BJ) every Thu
  workflow_dispatch:

permissions:
  contents: read  # min permission

concurrency:  # 1 PR multi-push, cance old
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: copyright
      run: |
        fail=0
        while IFS= read -r f; do
          grep -q 'SPDX-License-Identifier: BSD-3-Clause' "$f" || { echo "FAIL $f: SPDX"; fail=1; }
          grep -qE 'Copyright [0-9]{4} Shi-Zhong Chen' "$f" || { echo "FAIL $f: Chen"; fail=1; }
        done < <(git ls-files -- '*.hpp' '*.cpp' '*.py' '*.sh' '*CMakeLists.txt')
        exit $fail

    - name: install valgrind
      run: sudo apt-get update && sudo apt-get install valgrind

    - name: make ut
      run: cmake -Dci=cov -DCMAKE_CXX_COMPILER="g++" . && make -j

    - name: ut
      run: SLICE=always-malloc G_DEBUG=gc-friendly valgrind -v --tool=memcheck --leak-check=full --num-callers=40 --log-file=ut/gcovr/cov.valgrind.log --error-exitcode=6 ./ut_exe --gtest_brief=1

    - name: install gcovr
      run: pip install gcovr

    - name: ut coverage (ret=2 is fail-under-line, =4 is fail-under-branch)
      run: gcovr -k --config=ut/gcovr/gcovr.cfg && ls -lR .

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: |
          ./ut/gcovr/cov.*
          ./*gcov

    - uses: codecov/codecov-action@v7
      if: always()
      with:
        files: ut/gcovr/cov.xml
        disable_search: true
        slug: domino-library/domino-library
        flags: ci_main
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
