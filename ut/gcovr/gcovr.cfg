root    = ../..         # repo root; paths in this file are relative to ut/gcovr/
filter  = ../../src/.*  # match ../../src/*/
gcov-object-directory = ../../build-cov  # gcc cwd; keeps *.gcov.json.gz out of the repo root

# gcovr 8.x: exclude
exclude = .*/googletest/.*
exclude = .*/googlemock/.*
exclude = .*/x86_64-linux-gnu-toolchain/.*

exclude-unreachable-branches = yes  # inc coverage
exclude-throw-branches       = yes  # inc coverage
exclude-noncode-lines        = yes  # 6.0
exclude-lines-by-pattern     = ^(\s)*\b(TRC|INF|WRN|ERR|HID)\b\(.*$
merge-lines                  = yes  # merge template cov per type

fail-under-line   = 97.8  # catch(...) + abort-on-null
fail-under-branch = 91.4  # CI gcc (ubuntu-latest); local gcc15 reads ~0.5% higher

html          = yes  # summary report
html-details  = yes  # separate report for each source file
#calls        = yes  # 6.0, call column in report
#decisions    = yes  # decision column in report
output        = ../../build-cov/cov.html
cobertura     = ../../build-cov/cov.xml  # for codecov tool
print-summary = yes
